<!DOCTYPE html>
<html lang="sv">
  
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kontakta oss</title>
    <link rel="stylesheet" href="css/kontakt.css">
    <script src="js/kontakt.js" defer></script>
</head>

<body>
    <header id="mainheader" class="site-header">
    <a class="brand" href="index.html"><img class="brand-logo" src="images/logo.avif" alt="Racebutiken logotyp"></a>
    <button class="menu-toggle" type="button">&#9776;</button>
    <nav class="main-nav">
      <a href="index.html">Startsida</a>
      <a href="produkter.html">Produkter</a>
      <a class="active" href="kontakt.html">Kontakta oss</a>
    </nav>
    <a class="cart-link" href="produkter.html#varukorg">Varukorg <span class="cart-count">0</span></a>
    <form class="search-form" role="search" action="produkter.html">
      <label class="sr-only" for="site-search">Sök efter produkter</label>
      <input id="site-search" name="q" type="search" placeholder="Sök efter produkter...">
      <button type="submit">&#8981;</button>
    </form>
  </header>

  <main class="page-main container contain">
    <div class="page-heading">
      <p class="eyebrow">Vi hjälper gärna till</p>
      <h1>Kontakta oss</h1>
      <p>Skicka en fråga om produkter eller folkrace så återkommer vi.</p>
    </div>
    <form class="contact-form">
      <label for="name">Namn</label>
      <input id="name" name="name" type="text" placeholder="Ditt namn" required>
      <label for="email">E-post</label>
      <input id="email" name="email" type="email" placeholder="Din e-postadress" required>
      <label for="message">Meddelande</label>
      <textarea id="message" name="message" rows="5" placeholder="Skriv ditt meddelande här..." required></textarea>
      <button class="button" type="submit">Skicka meddelande</button>
      <p class="form-message"></p>
    </form>
  </main>

  <footer class="site-footer"><a href="index.html">&copy; 2026 Racebutiken</a><a href="produkter.html">Produkter</a></footer>
</body>
</html>
